# SonarQube with the PQCA Sonar Cryptography plugin (CBOMkit-hyperion) mounted.
# The plugin is what turns a source scan into a real CBOM; see scripts/sonarqube-up.sh.
services:
  sonarqube:
    image: sonarqube:26.1.0.118079-community
    container_name: cbom-sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_CE_JAVAOPTS: "-Xmx2g -Xms512m"
      SONAR_WEB_JAVAOPTS: "-Xmx2g -Xms512m"
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - ./.sonarqube/plugins:/opt/sonarqube/extensions/plugins
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'SonarQube is operational' /opt/sonarqube/logs/sonar.log"]
      interval: 15s
      timeout: 5s
      retries: 40

  db:
    image: postgres:17-alpine
    container_name: cbom-postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sonar-postgresql-data:/var/lib/postgresql/data

volumes:
  sonar-data:
  sonar-logs:
  sonar-postgresql-data:
